name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moderation-gui-build-${{ github.ref }}
  # Не прерываем матричную сборку Free/Pro новым push; ожидающий запуск проверит следующий commit.
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.edition }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [free, pro]
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Собрать и проверить редакцию
        run: gradle clean build --no-daemon -Pedition=${{ matrix.edition }}

      - name: Сохранить JAR
        uses: actions/upload-artifact@v4
        with:
          name: moderation-gui-${{ matrix.edition }}
          path: build/libs/*.jar
          if-no-files-found: error
