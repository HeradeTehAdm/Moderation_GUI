plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

group = project.maven_group
def moderationEdition = providers.gradleProperty('edition').getOrElse('free').toLowerCase(Locale.ROOT)
if (!(moderationEdition in ['free', 'pro'])) {
    throw new GradleException("Unknown edition '${moderationEdition}'. Use -Pedition=free or -Pedition=pro.")
}

version = "${project.mod_version}-${moderationEdition}"

base { archivesName = "${project.archives_base_name}-${moderationEdition}" }

def generatedEditionResources = layout.buildDirectory.dir('generated/moderationEditionResources')

sourceSets.main.resources.srcDir(generatedEditionResources)

tasks.register('generateEditionMetadata') {
    outputs.dir(generatedEditionResources)
    doLast {
        def metadataFile = generatedEditionResources.get().file('moderation-gui-edition.properties').asFile
        metadataFile.parentFile.mkdirs()
        metadataFile.text = "edition=${moderationEdition}\n"
    }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "moderation_gui" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // SQLite JDBC включается в JAR как вложенная зависимость, чтобы драйвер был доступен на сервере.
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    include 'org.xerial:sqlite-jdbc:3.50.3.0'

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

processResources {
    dependsOn tasks.named('generateEditionMetadata')
    inputs.property 'version', project.version
    inputs.property 'edition', moderationEdition
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}


tasks.test {
    useJUnitPlatform()
}
